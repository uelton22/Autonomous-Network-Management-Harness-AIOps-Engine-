# =========================================================================
# Catálogo de Perfis de Acesso e Credenciais SSH (Credentials Vault)
# =========================================================================
# Este arquivo define os perfis de autenticação utilizados pelo Harness.
#
# Formatos suportados para senhas (password e secret):
#   - Referência de ambiente: "env:NOME_VAR" (ex: "env:NETOPS_SSH_PASSWORD")
#   - Texto direto: "sua_senha_aqui"
#   - Token Criptografado (Fernet): "enc:gAAAAAB..." (use: python -m mcp_server.vault --encrypt "sua_senha")
# =========================================================================

version: "1.0"
default_profile: "default"

profiles:
  default:
    description: "Perfil operacional padrão de leitura e diagnóstico"
    username: "admin"
    password: "env:NETOPS_SSH_PASSWORD"
    port: 22
    secret: null
    ssh_key_path: null
    delay: 1.0

  zabbix:
    description: "Perfil de serviço de telemetria Zabbix"
    username: "zabbix"
    password: "env:NETOPS_SSH_PASSWORD"
    port: 22
    secret: null
    ssh_key_path: null
    delay: 1.0

  admin_core:
    description: "Perfil administrativo para switches de Core e agregação"
    username: "admin"
    password: "env:NETOPS_SSH_PASSWORD"
    port: 22
    secret: "env:NETOPS_SSH_SECRET"
    ssh_key_path: null
    delay: 1.5

  noc_port_2222:
    description: "Perfil NOC para equipamentos em porta SSH alternativa"
    username: "noc_user"
    password: "env:NETOPS_SSH_PASSWORD"
    port: 2222
    secret: null
    ssh_key_path: null
    delay: 1.0
