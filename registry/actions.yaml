version: "1.0"
description: "Catálogo Canônico Multi-Vendor de Ações Atômicas e Workflows DAG para Redes"

# -------------------------------------------------------------------------
# AÇÕES ATÔMICAS (Comandos Granulares Independentes com Resolução Multi-Versão)
# -------------------------------------------------------------------------
atomic_actions:
  get_system_version:
    description: "Coleta versão de firmware/software e sistema operacional"
    schema: "registry/schemas/device_info.json"
    privilege: "read"
    platforms:
      datacom_dmos_12:
        command: "show firmware"
        clean_pager: "terminal length 0"
      datacom_dmos:
        command: "show firmware"
        clean_pager: "terminal length 0"
      huawei_vrp_v200:
        command: "display version"
        clean_pager: "screen-length 0 temporary"
      huawei_vrp_v800:
        command: "display version"
        clean_pager: "screen-length 0 temporary"
      huawei_vrp:
        command: "display version"
        clean_pager: "screen-length 0 temporary"
      cisco_iosxe:
        command: "show version"
        clean_pager: "terminal length 0"

  get_hardware_model:
    description: "Coleta modelo de hardware, chassis, número de série e placas"
    schema: "registry/schemas/device_info.json"
    privilege: "read"
    platforms:
      datacom_dmos_12:
        command: "show platform | include DM"
        clean_pager: "terminal length 0"
        fallback_command: "show platform"
      datacom_dmos:
        command: "show platform | include DM"
        clean_pager: "terminal length 0"
        fallback_command: "show platform"
      huawei_vrp_v200:
        command: "display device"
        clean_pager: "screen-length 0 temporary"
        fallback_command: "display elabel"
      huawei_vrp_v800:
        command: "display device"
        clean_pager: "screen-length 0 temporary"
        fallback_command: "display elabel"
      huawei_vrp:
        command: "display device"
        clean_pager: "screen-length 0 temporary"
        fallback_command: "display elabel"
      cisco_iosxe:
        command: "show inventory"
        clean_pager: "terminal length 0"

  get_system_uptime:
    description: "Coleta tempo de atividade e recursos do sistema"
    schema: "registry/schemas/device_info.json"
    privilege: "read"
    platforms:
      datacom_dmos_12:
        command: "show system uptime"
        clean_pager: "terminal length 0"
        fallback_command: "show system"
      datacom_dmos:
        command: "show system uptime"
        clean_pager: "terminal length 0"
        fallback_command: "show system"
      huawei_vrp_v200:
        command: "display version"
        clean_pager: "screen-length 0 temporary"
      huawei_vrp:
        command: "display version"
        clean_pager: "screen-length 0 temporary"
      cisco_iosxe:
        command: "show version"
        clean_pager: "terminal length 0"

  get_system_users:
    description: "Coleta contas de usuários locais e privilégios configurados no sistema (openconfig-system/aaa)"
    schema: "registry/schemas/system_users.json"
    privilege: "read"
    platforms:
      datacom_dmos_12:
        command: "show running-config aaa"
        clean_pager: "terminal length 0"
      datacom_dmos:
        command: "show running-config aaa"
        clean_pager: "terminal length 0"
      huawei_vrp_v200:
        command: "display local-user"
        clean_pager: "screen-length 0 temporary"
      huawei_vrp_v800:
        command: "display local-user"
        clean_pager: "screen-length 0 temporary"
      huawei_vrp:
        command: "display local-user"
        clean_pager: "screen-length 0 temporary"
      cisco_iosxe:
        command: "show running-config | include username"
        clean_pager: "terminal length 0"

  get_active_sessions:
    description: "Coleta sessões de usuários ativas conectadas ao equipamento via SSH/CLI/SNMP/Console"
    schema: "registry/schemas/user_sessions.json"
    privilege: "read"
    platforms:
      datacom_dmos_12:
        command: "who"
        clean_pager: "terminal length 0"
      datacom_dmos:
        command: "who"
        clean_pager: "terminal length 0"
      huawei_vrp_v200:
        command: "display users"
        clean_pager: "screen-length 0 temporary"
      huawei_vrp_v800:
        command: "display users"
        clean_pager: "screen-length 0 temporary"
      huawei_vrp:
        command: "display users"
        clean_pager: "screen-length 0 temporary"
      cisco_iosxe:
        command: "show users"
        clean_pager: "terminal length 0"


# -------------------------------------------------------------------------
# WORKFLOWS ORQUESTRADOS (DAGs de Comandos Dependentes e Agregação Canônica)
# -------------------------------------------------------------------------
workflows:
  diagnose_down_interfaces:
    description: "Identifica interfaces caídas via brief e coleta detalhes de erro de forma granular"
    privilege: "read"
    steps:
      - step: 1
        name: "collect_summary"
        description: "Executa coleta rápida de status de todas as interfaces"
        action: "get_interface_summary"
        output_var: "summary_result"

      - step: 2
        name: "filter_down"
        description: "Filtro determinístico em código local (zero tokens LLM)"
        type: "code_filter"
        source: "summary_result.interfaces"
        condition: "item['oper_status'] == 'DOWN' or item['admin_status'] == 'DOWN'"
        output_var: "down_interfaces"

      - step: 3
        name: "collect_details"
        description: "Loop batch de coleta específica apenas nas interfaces afetadas"
        type: "batch_loop"
        foreach: "down_interfaces"
        action: "get_interface_detail"
        args:
          interface_name: "item['name']"
        output_var: "detailed_results"

      - step: 4
        name: "aggregate_openconfig"
        description: "Agrega resumo e detalhes em um único schema canônico"
        type: "aggregator"
        schema: "registry/schemas/interfaces.json"
        merge:
          base: "summary_result"
          details: "detailed_results"
        output_var: "final_payload"

  diagnose_bgp_flapping:
    description: "Audita peers BGP que não estão em Established e coleta rotas recebidas"
    privilege: "read"
    steps:
      - step: 1
        name: "collect_bgp_summary"
        action: "get_bgp_summary"
        output_var: "bgp_result"

      - step: 2
        name: "filter_abnormal_peers"
        type: "code_filter"
        source: "bgp_result.peers"
        condition: "item['state'] != 'Established' or item.get('prefixes_received', 0) == 0"
        output_var: "abnormal_peers"

      - step: 3
        name: "aggregate_openconfig"
        type: "aggregator"
        schema: "registry/schemas/bgp_summary.json"
        output_var: "final_payload"
